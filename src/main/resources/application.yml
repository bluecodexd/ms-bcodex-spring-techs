server:
  error:
    include-message: always
    include-stacktrace: always
  port: 8080


spring:
  application:
    name: ms-bcodex-spring-techs

  datasource:
    url: jdbc:h2:mem:techsdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration


logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb.core: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html