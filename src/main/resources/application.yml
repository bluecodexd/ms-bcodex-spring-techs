server:
  error:
    include-message: always
    include-stacktrace: always
  port: 8080


spring:
  application:
    name: ms-bcodex-spring-techs

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techsdb}
    username: yagami
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb.core: DEBUG


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html