apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms-bcodex-spring-techs.name" . }}
  labels:
    {{ include "ms-bcodex-spring-techs.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{ include "ms-bcodex-spring-techs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
